name: Verify Portfolio Build & Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Test & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install exact dependencies (clean install)
        run: npm ci

      - name: Run code quality linter
        run: npm run lint

      - name: Run unit & routing tests
        run: npm test

      - name: Run production build (Vite & TanStack Start)
        run: npm run build
